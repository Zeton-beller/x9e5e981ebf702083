name: "Build SoH Switch 9.3.0 CN (Clean Release)"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (发布版本标签)'
        required: false
        type: string
        default: 'v9.3.0-cn'
  push:
    branches:
      - switch-9.3.0-cn
      - switch-9.3.0-mt-opt
      - switch-9.3.0-mt-zreo-fix

jobs:
  build-switch:
    name: "Build Switch 9.3.0 CN (编译 Switch 纯净 9.3.0 汉化版)"
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20251117
    permissions:
      contents: write
    steps:
      - name: Fix dubious ownership
        run: git config --global --add safe.directory '*'

      - name: Install build tools, ccache and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip lsb-release $(cat .github/workflows/apt-deps.txt 2>/dev/null || echo "libsdl2-dev libpng-dev libgles2-mesa-dev ninja-build") zip git curl ccache
          sudo apt-get remove -y cmake || true
          sudo dkp-pacman -R --noconfirm switch-tinyxml2 || true
          pip install --break-system-packages cryptography
          wget https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.sh -O /tmp/cmake.sh
          sudo sh /tmp/cmake.sh --prefix=/usr/local/ --exclude-subdir

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
          submodules: recursive
          fetch-depth: 0

      - name: Restore compilation cache (ccache)
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-switch-clean-930-${{ hashFiles('CMakeLists.txt', 'soh/CMakeLists.txt') }}-${{ github.run_id }}
          restore-keys: |
            ccache-switch-clean-930-${{ hashFiles('CMakeLists.txt', 'soh/CMakeLists.txt') }}-
            ccache-switch-clean-930-

      - name: Configure ccache environment
        run: |
          mkdir -p .ccache
          export CCACHE_DIR="${PWD}/.ccache"
          ccache --set-config=max_size=3G
          ccache --set-config=compression=true
          ccache --zero-stats
          echo "CCACHE_DIR=${PWD}/.ccache" >> $GITHUB_ENV

      - name: "Build Host Tools & Generate soh.o2r (生成纯净 9.3.0 汉化资源包)"
        run: |
          echo "=== 正在构建 GenerateSohOtr 并生成 soh.o2r ==="
          cmake --no-warn-unused-cli -H. -Bbuild-tools -GNinja \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DSOH_TOOLS_ONLY=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-tools --config Release --target GenerateSohOtr -j$(nproc)
          if [ -f build-tools/soh/soh.o2r ]; then
            cp -v build-tools/soh/soh.o2r ./soh.o2r
          fi
          echo "soh.o2r 校验:"
          ls -lh soh.o2r

      - name: "Build Switch Binary (编译 Switch 9.3.0 汉化版 soh.nro)"
        run: |
          echo "=== 正在编译 Switch 平台目标 (soh.nro) ==="
          cmake -H. -Bbuild -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DBUILD_REMOTE_CONTROL=1 \
            -DDISABLE_SCRIPTING=1 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target soh_nro --config Release -j$(nproc)
          cp build/soh/*.nro soh.nro
          echo "Switch 构建产物验证:"
          ls -lh soh.nro

      - name: Verify Chinese symbols and NRO integrity
        run: |
          echo "=== 正在校验 NRO 内部中文字库与函数符号 ==="
          strings soh.nro | grep "Font_LoadCharChinese" || echo "Warning: Font_LoadCharChinese symbol not found"
          strings soh.nro | grep "sChiMessageEntryTablePtr" || echo "Warning: sChiMessageEntryTablePtr symbol not found"

      - name: Package Switch Release
        run: |
          echo "=== 打包 Switch 发行包 ==="
          mkdir -p switch/soh
          cp soh.nro switch/soh/soh.nro
          cp soh.o2r switch/soh/soh.o2r
          cp README.md switch/soh/readme.txt
          if [ "${{ github.ref_name }}" = "switch-9.3.0-mt-zreo-fix" ] || [ "${{ github.event.inputs.release_tag }}" = "v9.3.0-cn-mt-zreo" ]; then
            zip -r soh-switch-9.3.0-cn-mt-zreo.zip switch/
          elif [ "${{ github.ref_name }}" = "switch-9.3.0-mt-opt" ] || [ "${{ github.event.inputs.release_tag }}" = "v9.3.0-cn-mt" ]; then
            zip -r soh-switch-9.3.0-cn-mt.zip switch/
          else
            zip -r soh-switch-9.3.0-cn.zip switch/
          fi
          echo "压缩包验证:"
          ls -lh *.zip

      - name: Upload Switch Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soh-switch-release
          path: |
            soh.nro
            soh.o2r
            *.zip

  publish-release:
    name: "Publish to GitHub Releases (自动发布 Switch 发行版)"
    needs: build-switch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: soh-switch-release

      - name: Publish Release via GitHub CLI
        run: |
          if [ "${{ github.ref_name }}" = "switch-9.3.0-mt-zreo-fix" ] || [ "${{ github.event.inputs.release_tag }}" = "v9.3.0-cn-mt-zreo" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag || 'v9.3.0-cn-mt-zreo' }}"
            RELEASE_TITLE="Ship of Harkinian Switch v9.3.0 多线程优化 + 自适应插帧 + ZREO高清音乐修复版"
            ZIP_NAME="soh-switch-9.3.0-cn-mt-zreo.zip"
            cat << 'EOF' > release_notes.md
          ### Ship of Harkinian Switch 9.3.0 多线程优化 + 自适应插帧 + ZREO高清音乐修复版 (v9.3.0-cn-mt-zreo)

          本版本在**多线程性能优化版 (v9.3.0-cn-mt)** 的基础上，针对 **ZREO 高清音乐替换模组启动黑屏死锁**、**音频线程与主线程锁死互斥** 以及 **自适应插帧负载均衡与菜单自定义** 进行了深度源码级重构与升级：

          #### 🎵 1. 【重大修复】ZREO 音乐模组黑屏死锁彻底根治 (Opus 零线程同步直载)
          - 原版在启动加载 ZREO（成年篇与幼年篇）共 85 个音色库时，瞬间盲目并发派发了 170 个原生操作系统线程，打穿 Switch Horizon OS 内核线程句柄硬配额上限 (`svcCreateThread` 失败抛出 `std::system_error`)，导致游戏在启动 Logo 画面前永久黑屏挂死并伴随空指针竞态。
          - 本版识别 Opus 流式音频后，直接就地同步内存直载，将开机创建线程数由 170 个降为 0 个，彻底消除内核超限与空指针崩溃风险，完美无损享受 ZREO 全套高品质管弦乐！

          #### ⚡ 2. 音频线程与主线程彻底解耦 (Core 2 独立自主流式播放)
          - 彻底移除了渲染主循环每帧对音频线程的条件变量阻塞等待锁，将音频线程专属绑定在 Core 2 (优先级 0x2A 实时级) 自主独立循环轮询，杜绝 CPU 核心之间的相互死等与拖累。

          #### 🛡️ 3. 【全新升级】自适应插帧回退机制与菜单自定义滑块 (防雪崩动态负载均衡)
          - **自适应比例判定**：彻底废弃此前单一粗暴的固定 28ms/35FPS 硬回退，改为根据选择的目标帧率或“自适应刷新率(Match Refresh Rate)”目标按 50% 比例动态自适应计算（例如目标为 60 帧时，在 30~60 帧区间均能平滑享受插帧，仅在重负载掉破 30 帧时才切断冗余插帧削减 CPU Draw Calls 负载，杜绝雪崩掉帧）。
          - **设置菜单增加自定义滑块**：在游戏设置菜单【Graphics】下新增 `Drop Interpolation Below` 滑块，提供极高自定义自由度：
            * `Adaptive (50% Target)`：自动按目标帧率 50% 动态自适应（默认推荐）。
            * `Disabled (Never Drop)`：完全关闭回退机制，任何低帧率下均不跳过插帧。
            * `自定义数值 (2~60 FPS)`：玩家可根据个人喜好自由设定具体回退帧率阈值。

          #### 🚀 4. 深度 CPU 多核优化与官方中文延续
          - LTO 全程序链接时优化 + Cortex-A57 微架构适配；
          - ResourceManager 双线程解压池加速场景与高清纹理加载；
          - 完整保留 iQue 官方神游中文对白、字库、高精 UI 与 PR #1306 脸部纹理修复。

          #### 📦 安装方式：
          1. 下载 `soh-switch-9.3.0-cn-mt-zreo.zip` 并解压。
          2. 将解压得到的 `switch/soh` 文件夹复制覆盖到 Switch SD 卡根目录的 `switch/` 目录下。
          3. 在主界面按住 `R` 键启动任意已安装游戏进入 hbmenu（Title Override 满内存模式），运行 Ship of Harkinian。
          EOF
          elif [ "${{ github.ref_name }}" = "switch-9.3.0-mt-opt" ] || [ "${{ github.event.inputs.release_tag }}" = "v9.3.0-cn-mt" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag || 'v9.3.0-cn-mt' }}"
            RELEASE_TITLE="Ship of Harkinian Switch v9.3.0 多线程CPU性能优化版 (含LTO/Cortex-A57/核绑定)"
            ZIP_NAME="soh-switch-9.3.0-cn-mt.zip"
            cat << 'EOF' > release_notes.md
          ### Ship of Harkinian Switch 9.3.0 多线程CPU性能优化版 (v9.3.0-cn-mt)

          本版本基于**官方 9.3.0 纯净汉化稳定版**，深度实施针对 Nintendo Switch (Tegra X1) 硬件架构的三大多线程与CPU性能优化方案：

          #### 🚀 核心优化与架构升级：
          1. **方案一：全程序链接时优化 (LTO) 与 Cortex-A57 架构深度适配**
             - 开启 GCC/Clang 生产级 LTO (`INTERPROCEDURAL_OPTIMIZATION_RELEASE`)，打通模块间跨编译单元内联与死代码消除。
             - 针对 Tegra X1 定制 `-mtune=cortex-a57` 微架构指令调度与 `-ftree-vectorize` 自动向量化，启用 Release `-O3` 极致优化。
          2. **方案二：ResourceManager 异步资源解压线程池扩展 (1 -> 2 线程)**
             - 彻底打破单工作线程解压瓶颈，在 Switch 平台启用双并发工作线程 (`threadCount = 2`)。
             - 在 `OtrArchive` 底层封装 StormLib MPQ/O2R 句柄互斥锁 (`mArchiveMutex`)，确保并发解压与大地图/高清材质流式加载绝对线程安全，杜绝场景切换与快速移动时的掉帧卡顿。
          3. **方案三：Horizon OS 物理 CPU 核心亲和性与实时优先级分工绑定**
             - **核心 0 (Core 0, 优先级 0x2B)**：专供主游戏循环与图形渲染主线程 (`Graph_ThreadEntry`)，保证画面平稳 60FPS/高刷新率调度。
             - **核心 1 (Core 1, 优先级 0x2D)**：专供 ResourceManager 异步解压与后台加载线程池，利用空闲 CPU 算力高速并行解压。
             - **核心 2 (Core 2, 优先级 0x2A 实时级)**：专供实时音频混音与播放线程 (`OTRAudio_Thread`)，彻底消除高负载复杂场景下的爆音与音频卡顿。
             - **核心 3 (Core 3)**：完全保留给 Switch Horizon OS 系统服务与蓝牙驱动，避免与系统争抢核心中断。
          4. **延续全套神游官方中文与脸部修复**：
             - 完整保留 iQue 官方中文对白、字库与高精 UI 材质包。
             - 完整保留 PR #1306 脸部纹理 Fast3D 渲染修复。

          #### 安装方式：
          1. 下载 `soh-switch-9.3.0-cn-mt.zip` 并解压。
          2. 将解压得到的 `switch/soh` 文件夹复制覆盖到 Switch SD 卡根目录的 `switch/` 目录下。
          3. 在主界面按住 `R` 键启动任意已安装游戏进入 hbmenu（Title Override 满内存模式），运行 Ship of Harkinian。
          EOF
          else
            TAG_NAME="${{ github.event.inputs.release_tag || 'v9.3.0-cn' }}"
            RELEASE_TITLE="Ship of Harkinian Switch v9.3.0 纯净汉化版 (含脸部修复)"
            ZIP_NAME="soh-switch-9.3.0-cn.zip"
            cat << 'EOF' > release_notes.md
          ### Ship of Harkinian Switch 9.3.0 纯净汉化稳定版

          本版本基于**官方 9.3.0 (Dewey Alfa) 稳定发行版**构建，剔除所有上游未发布的实验性开发代码，提供最稳定可靠的游戏体验。

          #### 包含的核心组件：
          - **官方主分支 9.3.0 稳定内核**：完整保留原汁原味的官方 9.3.0 逻辑，解决开发版可能引发的场景切换闪退。
          - **Switch 掌机原生支持**：完整集成 Tim Schneeberger 官方 Switch 适配代码（OpenGL/SDL2、音频驱动、手柄映射）。
          - **神游官方中文剧情与全套资产**：
            - iQue 官方中文对白、任务剧情与道具名称
            - 地点提示卡与全套高精汉化 UI 贴图
            - 嵌入式中文点阵字库支持
            - 配置菜单保持原生英文，杜绝方块黑框乱码
          - **PR #1306 脸部纹理修复**：彻底修复 3D 林克在替换高清材质包时眼部与嘴部拉伸扭曲变形的 Fast3D 渲染 Bug。

          #### 安装方式：
          1. 下载 `soh-switch-9.3.0-cn.zip` 并解压。
          2. 将 `switch/soh` 文件夹复制覆盖到 Switch SD 卡根目录的 `switch/` 目录下。
          3. 在主界面按住 `R` 键启动任意已安装游戏进入 hbmenu（Title Override 满内存模式），运行 Ship of Harkinian。
          EOF
          fi

          echo "Target Release Tag: ${TAG_NAME}"
          echo "Commit SHA: ${{ github.sha }}"

          # 删除同名已有发布（如存在）以便覆盖发布
          gh release delete "${TAG_NAME}" -y --cleanup-tag --repo "${GH_REPO}" || true

          # 创建正式发布
          gh release create "${TAG_NAME}" \
            soh.nro \
            soh.o2r \
            "${ZIP_NAME}" \
            --title "${RELEASE_TITLE}" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --repo "${GH_REPO}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
