name: "Build SoH Switch 9.3.0 CN - Orig Menu"

on:
  workflow_dispatch:
  push:
    branches:
      - switch-9.3.0-cn

jobs:
  build-switch-orig-menu:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20251117
    steps:
      - name: Fix dubious ownership error
        run: git config --global --add safe.directory '*'

      - name: Install build tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip lsb-release $(cat .github/workflows/apt-deps.txt) zip
          sudo apt-get remove -y cmake || true
          sudo dkp-pacman -R --noconfirm switch-tinyxml2 || true
          pip install --break-system-packages cryptography
          wget https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.sh -O /tmp/cmake.sh
          sudo sh /tmp/cmake.sh --prefix=/usr/local/ --exclude-subdir

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply patches for Switch Chinese font support
        run: python3 scripts/apply_patches.py

      - name: "Build Original Menu Version (Edition A: Orig Menu)"
        run: |
          echo "=== 正在构建版本 A: 仅游戏剧情汉化版 (配置菜单原生英文) ==="
          cmake -H. -Bbuild -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DBUILD_REMOTE_CONTROL=1 \
            -DDISABLE_SCRIPTING=1 \
            -DDISABLE_MENU_LOCALIZATION=ON
          cmake --build build --target soh_nro --config Release -j$(nproc)
          cp build/soh/*.nro soh_9.3.0_cn_orig_menu.nro
          cp soh_9.3.0_cn_orig_menu.nro soh.nro
          echo "版本 A 构建完成: soh_9.3.0_cn_orig_menu.nro"

      - name: Verify Chinese symbols in NRO
        run: |
          echo "--- 校验版本 A (原版英文菜单版) ---"
          strings soh_9.3.0_cn_orig_menu.nro | grep "Font_LoadCharChinese" || echo "Warning: Font_LoadCharChinese not found"
          strings soh_9.3.0_cn_orig_menu.nro | grep "sChiMessageEntryTablePtr" || echo "Warning: sChiMessageEntryTablePtr not found"

      - name: Package Switch Chinese Orig Menu Release
        run: |
          mkdir -p switch/soh
          cp soh_9.3.0_cn_orig_menu.nro switch/soh/soh.nro
          cp soh_9.3.0_cn_orig_menu.nro switch/soh/soh_9.3.0_cn_orig_menu.nro
          cp soh.o2r switch/soh/soh.o2r
          cp README.md switch/soh/readme.txt
          zip -r soh-switch-9.3.0-cn-orig-menu.zip switch/

      - name: Upload Switch Orig Menu Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soh-switch-9.3.0-cn-orig-menu
          path: |
            soh.nro
            soh_9.3.0_cn_orig_menu.nro
            soh.o2r
            soh-switch-9.3.0-cn-orig-menu.zip
